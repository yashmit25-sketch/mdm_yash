
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practical_6 Yash Makode</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 flex items-center justify-center p-6">

    <!-- Calculator Card -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">

        <!-- Header -->
        <div class="bg-slate-900 text-white px-8 py-7">
            <h1 class="text-2xl font-bold">
                Practical Grade Calculator
            </h1>

            <p class="text-slate-300 text-sm mt-2">
                Enter your practical marks to calculate your final grade.
            </p>
        </div>


        <!-- Calculator Body -->
        <div class="p-8">

            <!-- Practical 1 -->
            <div class="mb-5">
                <label for="p1" class="block text-sm font-semibold text-slate-700 mb-2">
                    Lab Practical 1
                    <span class="font-normal text-slate-400">(out of 100)</span>
                </label>

                <input
                    type="number"
                    id="p1"
                    min="0"
                    max="100"
                    placeholder="Enter marks"
                    class="w-full px-4 py-3 rounded-lg border border-slate-300
                           outline-none transition
                           focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                >
            </div>


            <!-- Practical 2 -->
            <div class="mb-5">
                <label for="p2" class="block text-sm font-semibold text-slate-700 mb-2">
                    Lab Practical 2
                    <span class="font-normal text-slate-400">(out of 100)</span>
                </label>

                <input
                    type="number"
                    id="p2"
                    min="0"
                    max="100"
                    placeholder="Enter marks"
                    class="w-full px-4 py-3 rounded-lg border border-slate-300
                           outline-none transition
                           focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                >
            </div>


            <!-- Viva -->
            <div class="mb-6">
                <label for="p3" class="block text-sm font-semibold text-slate-700 mb-2">
                    Viva / Oral Exam
                    <span class="font-normal text-slate-400">(out of 100)</span>
                </label>

                <input
                    type="number"
                    id="p3"
                    min="0"
                    max="100"
                    placeholder="Enter marks"
                    class="w-full px-4 py-3 rounded-lg border border-slate-300
                           outline-none transition
                           focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                >
            </div>


            <!-- Calculate Button -->
            <button
                onclick="calculateResults()"
                class="w-full py-3.5 rounded-lg
                       bg-indigo-600 text-white font-semibold
                       hover:bg-indigo-700
                       active:scale-[0.98]
                       transition duration-200
                       shadow-md hover:shadow-lg"
            >
                Calculate Result
            </button>


            <!-- Results -->
            <div
                id="outputBox"
                class="hidden mt-7 rounded-xl border border-slate-200 bg-slate-50 p-6"
            >

                <h2 class="text-lg font-bold text-slate-800 mb-5">
                    Your Result
                </h2>


                <!-- Total -->
                <div class="flex justify-between items-center py-3 border-b border-slate-200">
                    <span class="text-slate-600">
                        Total Marks
                    </span>

                    <span class="font-bold text-slate-900">
                        <span id="total"></span>
                        <span class="text-slate-400 font-normal">/ 300</span>
                    </span>
                </div>


                <!-- Percentage -->
                <div class="flex justify-between items-center py-3 border-b border-slate-200">
                    <span class="text-slate-600">
                        Percentage
                    </span>

                    <span class="font-bold text-indigo-600">
                        <span id="percentage"></span>%
                    </span>
                </div>


                <!-- Grade -->
                <div class="flex justify-between items-center pt-4">

                    <span class="text-slate-600">
                        Grade
                    </span>

                    <span
                        id="grade"
                        class="px-4 py-1.5 rounded-full
                               bg-indigo-100 text-indigo-700
                               font-bold text-sm"
                    ></span>

                </div>

            </div>

        </div>

    </div>


    <script>

        function calculateResults() {

            // Read input values
            const p1 = parseFloat(document.getElementById("p1").value);
            const p2 = parseFloat(document.getElementById("p2").value);
            const p3 = parseFloat(document.getElementById("p3").value);


            // Check for invalid input
            if (
                isNaN(p1) || isNaN(p2) || isNaN(p3) ||
                p1 < 0 || p1 > 100 ||
                p2 < 0 || p2 > 100 ||
                p3 < 0 || p3 > 100
            ) {
                alert("Please enter valid marks between 0 and 100.");
                return;
            }


            // Calculations
            const maxMarks = 300;

            const total = p1 + p2 + p3;

            const percentage = (total / maxMarks) * 100;


            // Grade determination
            let grade = "";

            if (percentage >= 90) {
                grade = "A+ (Excellent)";
            }
            else if (percentage >= 80) {
                grade = "A (Very Good)";
            }
            else if (percentage >= 70) {
                grade = "B (Good)";
            }
            else if (percentage >= 60) {
                grade = "C (Satisfactory)";
            }
            else {
                grade = "F (Fail)";
            }


            // Display results
            document.getElementById("total").textContent =
                total.toFixed(1);

            document.getElementById("percentage").textContent =
                percentage.toFixed(2);

            document.getElementById("grade").textContent =
                grade;

            document.getElementById("outputBox").classList.remove("hidden");
        }

    </script>

</body>
</html>
